# ============================================================
# 本机配置模板（可提交，不含真实口令）
#
# 使用方式：复制本文件为 application-local.yaml，填入你本机的真实值；
#          application-local.yaml 已被 .gitignore 忽略，不会被提交。
#
#   Windows:  copy src\main\resources\application-local.example.yaml src\main\resources\application-local.yaml
#   macOS/Linux: cp src/main/resources/application-local.example.yaml src/main/resources/application-local.yaml
#
# 若你更想用环境变量，可完全不创建 application-local.yaml，
# 直接设置 MYSQL_PASSWORD / REDIS_HOST / REDIS_PASSWORD 等变量即可。
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: your-mysql-password
  redis:
    host: 127.0.0.1
    port: 6379
    password: your-redis-password
