# ============================================================
# 通用配置：只放默认值与占位符，不写任何真实口令
#
# 真实口令放同目录 application-local.yaml（已被 .gitignore 忽略）
# 也可用环境变量覆盖，无需改文件：
#   MYSQL_HOST / MYSQL_PORT / MYSQL_DB / MYSQL_USERNAME / MYSQL_PASSWORD
#   REDIS_HOST / REDIS_PORT / REDIS_PASSWORD
# 端口如需临时改，启动参数加 --server.port=8082 即可
# ============================================================
server:
  port: 8081

spring:
  application:
    name: hmdp
  # 默认激活 local profile，对应 application-local.yaml；
  # 若该文件不存在，则全部使用下面写的默认值，不会启动失败
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:hmdp}?useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段

mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包

logging:
  level:
    com.hmdp: debug
